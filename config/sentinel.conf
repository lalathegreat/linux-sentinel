# Linux Sentinel Declarative Runtime Configuration
# Version: 1.0.0

[global]
polling_interval_ms = 1000
log_file_path = logs/incidents.log
enable_ansi_tui = true

[detection_thresholds]
consecutive_samples_required = 3
memory_leak_slope_threshold_kb = 2048
memory_max_rss_limit_kb = 102400
cpu_saturation_threshold_percent = 85.0
history_window_size = 5

[recovery_policy]
graceful_stop_timeout_ms = 3000
circuit_breaker_max_retries = 3
circuit_breaker_window_ms = 60000
verification_stabilization_ms = 2000

[services]
# Service 1: Target Test Application
service.1.name = fault_app
service.1.executable = ./build/fault_app
service.1.arguments = --normal
service.1.depends_on = none
service.1.allow_auto_recovery = true

# Service 2: Simulated Backend Service (For Dependency Demonstration)
service.2.name = database
service.2.executable = ./build/fault_app
service.2.arguments = --name database
service.2.depends_on = none
service.2.allow_auto_recovery = true

# Service 3: Simulated Dependent Service
service.3.name = api_gateway
service.3.executable = ./build/fault_app
service.3.arguments = --name api_gateway
service.3.depends_on = database
service.3.allow_auto_recovery = true
